name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; los pushes nuevos cancelan las builds en cola.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Typecheck was missing here, so a type error could ship: neither the linter nor `vite build`
      # runs the compiler, and only `tsc -b` does.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # The sharing service. Not a secret — it is a public endpoint, and the app hides the
          # share button when this is unset.
          VITE_SHARE_URL: https://castillon-share.strombus.workers.dev
      # The build's own output checked before it ships: the code splitting that keeps the first paint
      # small is undone by a single static import, and nothing about such an import looks wrong.
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
