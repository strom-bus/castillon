# The sharing service. Deployed separately from the app: the app is static files on GitHub Pages,
# this is the one piece that has to run somewhere.
#
#   npx wrangler login                                   once, opens a browser
#   npx wrangler kv namespace create PATCHES             prints the id to paste below
#   npx wrangler d1 create castillon-gallery             prints the id to paste below
#   npx wrangler d1 execute castillon-gallery --remote --file=src/share/schema.sql
#   npx wrangler deploy                                  prints the service URL
#
# Moderation. Until this secret is set the service has no administrator rather than an open door, so
# nothing can be taken down except by whoever published it, within their day:
#
#   npx wrangler secret put GALLERY_ADMIN_KEY             paste a long random string
#
# It lives only here, on the service. It is not in this repository, the app never holds it, and no build
# embeds it — so rotating it is that one command and nothing else: no code change, no deploy, no push.
# It takes effect on the next request. Generate one with `openssl rand -base64 32` rather than choosing
# a word, and check afterwards that the old one is refused:
#
#   curl -s -o /dev/null -w '%{http_code}\n' -X DELETE \
#     https://castillon-share.strombus.workers.dev/gallery/00000000-0000-0000-0000-000000000000 \
#     -H 'authorization: Bearer <the old key>' -H 'content-type: application/json' -d '{}'
#
# 403 means it is refused, which is the answer wanted. 204 means it still works.
#
# Deploying from CI needs a token instead of a browser login: Cloudflare dashboard, My Profile, API
# Tokens, Create Token, the "Edit Cloudflare Workers" template, adding D1 · Edit if the template does
# not list it. Then `gh secret set CLOUDFLARE_API_TOKEN` in a terminal — which prompts, so the token is
# never in a shell history or a file.
#
# Then, to remove anything at all:
#
#   curl -X DELETE https://castillon-share.strombus.workers.dev/gallery/<id> \
#        -H "authorization: Bearer <the key>" -H 'content-type: application/json' -d '{}'
#
# The URL then goes into the app as VITE_SHARE_URL. Until it does, the app hides the share button
# and everything else works exactly as before.
name = "castillon-share"
main = "src/share/worker.ts"
compatibility_date = "2026-08-19"

# Named here rather than left to be inferred, and not a secret — it identifies an account, it does not
# open one.
#
# Not required today, which is worth writing down rather than implying otherwise: a token scoped to a
# single account lets wrangler work the account out on its own, and the CI deploy ran green without this
# line. It matters for a token that can see more than one, where wrangler cannot choose and fails asking
# for an environment variable nobody knew to set. One line, and that failure cannot arrive later.
account_id = "dc4ee830024b072d08f87f77c5dd46dd"

# Created by the command above; the id is not a secret.
[[kv_namespaces]]
binding = "PATCHES"
id = "59c9b7e9a42e46948a49021d63d9a059"

# The gallery. SQLite rather than KV because a gallery has to answer "the most recent twenty", which
# KV cannot do without listing every key and sorting them by hand (PLAN §12.2).
[[d1_databases]]
binding = "GALLERY"
database_name = "castillon-gallery"
database_id = "0065d577-7cfb-4504-8ef7-7ea3f784771c"

# Rate limiting at the edge, keyed by a digest of the address.
#
# The per-publisher limit inside the Worker is resettable — clearing `localStorage` mints a new id —
# so it stops accidents and not determination. This one is keyed by where the request came from, and
# it keeps nothing: the limiter is ephemeral by design, which is what lets it use an address at all
# without breaking the promise in PLAN §12.3 that none is stored.
[[unsafe.bindings]]
name = "PUBLISH_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Starring, limited separately and far more loosely.
#
# A star is one row per browser, and a browser can mint itself a new identity by clearing storage — so
# the count is inflatable by anyone willing to. This does not close that: it prices it. A script that
# would have added a thousand stars in a second now takes an afternoon, for the reward of sitting
# briefly on top of a ranking that decays and is not even the default ordering.
#
# Twenty a minute, which is well past anyone reading a wall and starring what they like.
#
# Approximate, and deliberately relied on as such. Cloudflare's limiter is eventually consistent per
# location: a burst is cut hard — forty at once came back twenty-eight refused — while a slow trickle
# can slip past the nominal figure. It sheds load rather than counting exactly, and that is the right
# shape for this. The point was never a quota; it was making a script no cheaper than patience.
[[unsafe.bindings]]
name = "STAR_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Failed attempts at the maintainer's key.
#
# Only failures are counted, so working with the real key never spends this and an administrator
# cannot lock themselves out. The whole security of that route is the key being unguessable, and
# without a limit here a short key falls to a wordlist in seconds; with one, the same list takes days.
[[unsafe.bindings]]
name = "ADMIN_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 5, period = 60 }
