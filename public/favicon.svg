<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- One trigger, two branches. Painted with the cascade ramp rather than ink, so the mark holds
       on a light tab strip and a dark one alike. -->
  <defs>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14cc6a"/>
      <stop offset=".52" stop-color="#d8f519"/>
      <stop offset="1" stop-color="#ff531f"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#r)" stroke-width="11" stroke-linecap="round">
    <path d="M 42 27 C 33 41 27 56 24 65"/>
    <path d="M 58 27 C 67 41 73 56 76 65"/>
  </g>
  <g fill="url(#r)">
    <circle cx="50" cy="17" r="13"/>
    <circle cx="21" cy="79" r="13"/>
    <circle cx="79" cy="79" r="13"/>
  </g>
</svg>
