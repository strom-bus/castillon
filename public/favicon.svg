<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- One trigger, two branches, in the deepest colour on the cascade ramp: the same orange the
       wordmark carries.

       No tile and no background on purpose. A white mark would vanish into the near-white tab strip
       of a light browser and a black one into a dark browser's, while this orange holds against
       both, which is what lets the mark stand on its own.

       The geometry repeats logoGeometry.ts and the colour repeats the brand token in index.css,
       neither of which can be referenced here: a favicon is read before any script or stylesheet
       runs. logo.test.ts fails if any of them drift apart.

       Note for editors: an XML comment cannot contain a double hyphen, so CSS custom properties
       cannot be named in one. Writing the token with its dashes here made this file unparseable,
       which a browser answers by silently keeping whichever icon it already had. -->
  <g fill="none" stroke="#ff531f" stroke-width="11" stroke-linecap="butt">
    <path d="M 42 27 C 33 41 27 56 23 73"/>
    <path d="M 58 27 C 67 41 73 56 77 73"/>
  </g>
  <g fill="#ff531f">
    <rect x="35" y="2" width="30" height="30"/>
    <rect x="6" y="64" width="30" height="30"/>
    <rect x="64" y="64" width="30" height="30"/>
  </g>
</svg>
