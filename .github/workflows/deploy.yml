name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; los pushes nuevos cancelan las builds en cola.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Typecheck was missing here, so a type error could ship: neither the linter nor `vite build`
      # runs the compiler, and only `tsc -b` does.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          # The sharing service. Not a secret — it is a public endpoint, and the app hides the
          # share button when this is unset.
          VITE_SHARE_URL: https://castillon-share.strombus.workers.dev
      # The build's own output checked before it ships: the code splitting that keeps the first paint
      # small is undone by a single static import, and nothing about such an import looks wrong.
      - run: npm run size
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # The sharing service, deployed with the app rather than by hand.
  #
  # The two share one `patchCode.ts` and cannot disagree in the repository — but they were deployed
  # separately, and a format change that shipped on only one side left the service unable to read a
  # single code the app produced. Sharing was broken online for several commits that way, with nothing
  # wrong in the repository and an empty gallery as the only symptom.
  #
  # It runs before the app: a service that can read what the app has not started writing yet is
  # harmless, and an app writing what the service cannot read is the fault above.
  worker:
    runs-on: ubuntu-latest
    # Set on the job rather than on the step, which is what makes it readable from a step's `if`:
    # the `secrets` context is not, so a step cannot ask whether its own secret is present.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Skipped rather than failed where the token is not set, so a fork can build the app without
      # holding credentials for somebody else's account.
      - name: Deploy the share worker
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npm run deploy:worker
      # Whether or not this run deployed it, the live service must be able to read what this commit
      # writes. That is the check whose absence let the two drift.
      - name: Check the live service reads this build
        run: npm run check:service
        env:
          VITE_SHARE_URL: https://castillon-share.strombus.workers.dev

  deploy:
    needs: [build, worker]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
